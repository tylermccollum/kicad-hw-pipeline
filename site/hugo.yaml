# baseURL and the empty lists below are overridden per build by
# config_override.yaml (written by `hw build`/`hw release`, locally and in CI).
baseURL: /latest/
languageCode: en-us
title: "__PROJECT_TITLE__"

module:
  imports:
    - path: github.com/laenzlinger/hugo-kicad-site

params:
  projectName: "__PROJECT_TITLE__"
  description: "KiCad hardware project"
  repoURL: "__REPO_URL__"
  license: ""
  version: "main"
  renders: []
  # Mermaid diagrams (```mermaid blocks) from the vendored copy in assets/js,
  # so neither builds nor visitors fetch it from a CDN.
  mermaid:
    js: js/mermaid.min.js
  downloads: []
  kicadFiles: []
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  page:
    width: wide
  theme:
    default: system
    displayToggle: false
  footer:
    displayCopyright: false
    displayPoweredBy: false

menu:
  main:
    - name: Design
      pageRef: /design/
      weight: 10
    - name: Board
      pageRef: /board/
      weight: 20
    - name: Drawings
      pageRef: /drawings/
      weight: 30
    - name: BOM
      pageRef: /bill-of-materials/
      weight: 40
    - name: Software
      pageRef: /software/
      weight: 45
    - name: Release
      pageRef: /release/
      weight: 50
    - name: GitHub
      url: __REPO_URL__
      params:
        icon: github
      weight: 100
    - name: Theme Toggle
      weight: 110
      params:
        type: theme-toggle

# Pages use raw HTML (hero render) and shortcodes.
markup:
  goldmark:
    renderer:
      unsafe: true
